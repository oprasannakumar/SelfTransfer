<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wi-Fi Access Test</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f0fdf4;
            color: #166534;
        }
        .container {
            text-align: center;
            padding: 3rem;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border: 2px solid #22c55e;
            max-width: 400px;
        }
        h1 {
            margin-top: 0;
            font-size: 1.8rem;
        }
        p {
            line-height: 1.5;
            color: #374151;
        }
        .ip-display {
            font-family: monospace;
            background: #f3f4f6;
            padding: 0.75rem;
            border-radius: 6px;
            color: #111827;
            font-size: 1.25rem;
            font-weight: bold;
            margin-top: 1rem;
            display: inline-block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✅ Access Granted!</h1>
        <p>If you can see this page, your connection was allowed through the firewall.</p>
        <p>Your current Public IP Address is:</p>
        <div class="ip-display" id="ip-address">Detecting IP...</div>
    </div>

    <script>
        // This script fetches the user's public IP address to help you verify the whitelist
        fetch('https://api.ipify.org?format=json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('ip-address').innerText = data.ip;
            })
            .catch(error => {
                document.getElementById('ip-address').innerText = 'Unable to fetch IP';
            });
    </script>
</body>
</html>
